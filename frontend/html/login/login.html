<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../../../frontend/css/login/login.css">
</head>
<body>
     <main class="container">

        <header class="header">
            <h1>Pizzaria Bizu</h1>
        </header>

        <form class="login">

            <h2 class="login-title">LOGIN</h2>

            <div class="campo">
                <label for="usuario">Email do usuário</label>
                <input
                    type="text"
                    id="usuario"
                    name="usuario"
                    placeholder="Email"
                >
            </div>

            <div class="campo">
                <label for="senha">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Senha"
                >
            
            </div>
            <div class="esqueci-senha">
                <a href="#">Esqueci minha senha</a>
            </div>

            <button type="submit">
                INICIAR
            </button>

            <div class="cadastrar">
                <a href="#">Cadastre-se</a>
            </div>

        </form>

    </main>

</body>
</html>
